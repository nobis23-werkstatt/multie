name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Node & PowerShell test suite
        run: npm test
      - name: Verify CLI dry-run debate & parallel modes
        run: |
          npm run demo:debate
          npm run demo:parallel
